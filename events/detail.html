<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Event — LKP Kelas Bisa</title>
  
  <!-- CSS Global & CSS Events -->
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="style.css">
  
  <!-- Parser Markdown (Marked.js) untuk Render Konten .md -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* Styling Tambahan Khusus Halaman Detail Event */
    .event-detail-section {
      padding: 3rem 0 5rem 0;
    }
    .event-detail-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2.5rem;
    }
    .event-detail-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
    }
    .event-sidebar-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: 1.8rem;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      position: sticky;
      top: 90px;
    }
    .event-poster-wrapper {
      width: 100%;
      max-height: 420px;
      overflow: hidden;
      border-radius: var(--radius-md);
      margin-bottom: 2rem;
      background: var(--bg-light);
    }
    .event-poster-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .checkout-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--accent-orange);
      color: #FFF;
      font-weight: 800;
      font-size: 1.05rem;
      padding: 1rem 1.5rem;
      border-radius: var(--radius-md);
      box-shadow: 0 4px 14px rgba(255, 107, 0, 0.4);
      margin-top: 1.5rem;
    }
    .checkout-btn:hover {
      background: #E05E00;
      transform: translateY(-2px);
    }
    .feature-list-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      margin-bottom: 0.6rem;
      color: var(--text-main);
    }
    @media (max-width: 992px) {
      .event-detail-grid {
        grid-template-columns: 1fr;
      }
      .event-sidebar-card {
        position: static;
      }
    }
  </style>
</head>
<body>

  <!-- 1. WADAH HEADER AUTOMATIC INJECT VIA COMPONENTS.JS -->
  <div id="app-header"></div>

  <main class="event-detail-section">
    <div class="events-container">
      
      <!-- NAVIGASI KEMBALI -->
      <div style="margin-bottom: 1.5rem;">
        <a href="/events/" style="color: var(--primary-cyan-dark); font-weight: 700; font-size: 0.9rem;">
          ← Kembali ke Katalog Event & Try Out
        </a>
      </div>

      <!-- WADAH GRID RENDERER DETAIL EVENT -->
      <div id="eventDetailContainer" class="event-detail-grid">
        <div class="events-loading" style="grid-column: span 2;">Memuat rincian acara...</div>
      </div>

    </div>
  </main>

  <!-- 2. WADAH FOOTER AUTOMATIC INJECT VIA COMPONENTS.JS -->
  <div id="app-footer"></div>

  <!-- SCRIPT COMPONENTS -->
  <script src="../assets/js/components.js"></script>

  <!-- SCRIPT LOGIKA RENDERER SINGLE DETAIL EVENT -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // 1. TANGKAP PARAMETER ID DARI URL (contoh: detail.html?id=2026-10-tryout-cpns)
      const urlParams = new URLSearchParams(window.location.search);
      const eventId = urlParams.get("id");

      const detailContainer = document.getElementById("eventDetailContainer");

      if (!eventId) {
        detailContainer.innerHTML = `
          <div class="event-detail-card" style="grid-column: span 2; text-align: center;">
            <h2 style="color:#EF4444;">Parameter Event Tidak Ditemukan</h2>
            <p style="margin-top:0.5rem; color:var(--text-muted);">Silakan pilih event terlebih dahulu melalui katalog utama.</p>
            <a href="/events/" class="btn-primary" style="display:inline-block; margin-top:1.5rem;">Lihat Katalog Events</a>
          </div>
        `;
        return;
      }

      // 2. JALANKAN PROSES FETCH & RENDER
      loadEventDetail(eventId);

      async function loadEventDetail(id) {
        try {
          // Coba cari file .json terlebih dahulu, jika gagal fallback ke .md
          let data = null;
          let isMarkdown = false;

          try {
            const jsonRes = await fetch(`content/${id}.json`);
            if (jsonRes.ok) {
              data = await jsonRes.json();
            }
          } catch (e) {
            // Json not found
          }

          if (!data) {
            const mdRes = await fetch(`content/${id}.md`);
            if (mdRes.ok) {
              const textMd = await mdRes.text();
              data = parseMarkdownWithBody(textMd, id);
              isMarkdown = true;
            }
          }

          if (!data) {
            throw new Error("File event tidak ditemukan.");
          }

          // RENDER DISPLAY HTML
          renderDetailView(data, isMarkdown);

        } catch (err) {
          console.error("Error loading detail:", err);
          detailContainer.innerHTML = `
            <div class="event-detail-card" style="grid-column: span 2; text-align: center;">
              <h2 style="color:#EF4444;">Data Event Tidak Ditemukan</h2>
              <p style="margin-top:0.5rem; color:var(--text-muted);">Event yang kamu cari mungkin telah berakhir atau terhapus.</p>
              <a href="/events/" class="btn-primary" style="display:inline-block; margin-top:1.5rem;">Kembali ke Events</a>
            </div>
          `;
        }
      }

      /**
       * Parser Markdown khusus yang memisahkan Frontmatter dan Isi Konten Teks
       */
      function parseMarkdownWithBody(mdContent, fallbackId) {
        const frontmatterRegex = /^---\r?\n([\s\S]*?)\r?\n---/;
        const match = frontmatterRegex.exec(mdContent);

        const data = { id: fallbackId, bodyText: mdContent };

        if (match) {
          const frontmatterBlock = match[1];
          data.bodyText = mdContent.replace(match[0], "").trim();

          frontmatterBlock.split("\n").forEach((line) => {
            const [key, ...valueParts] = line.split(":");
            if (key && valueParts.length > 0) {
              const cleanKey = key.trim();
              let cleanValue = valueParts.join(":").trim().replace(/^["']|["']$/g, "");
              data[cleanKey] = cleanValue;
            }
          });
        }

        return data;
      }

      /**
       * Merender Tampilan Rincian Event & Sidebar Transaksi
       */
      function renderDetailView(event, isMarkdown) {
        document.title = `${event.title || "Detail Event"} — LKP Kelas Bisa`;

        const bannerImg = event.banner || "../assets/images/hero-banner.png";
        const subbrandLabel = event.subbrand_label || (event.subbrand ? event.subbrand.toUpperCase() : "KELAS BISA");
        const checkoutLink = event.checkout_url || "#";

        // Main Content HTML (JSON vs MD)
        let contentHTML = "";
        if (isMarkdown && event.bodyText && typeof marked !== "undefined") {
          contentHTML = `<div class="pilar-markdown-body">${marked.parse(event.bodyText)}</div>`;
        } else if (event.summary) {
          contentHTML = `
            <p style="font-size:1.05rem; line-height:1.7; color:var(--text-muted); margin-bottom:1.8rem;">
              ${event.summary}
            </p>
          `;
        }

        // Features List HTML (jika ada)
        let featuresHTML = "";
        if (event.features && Array.isArray(event.features)) {
          featuresHTML = `
            <div style="margin-top:2rem; border-top:1px solid var(--border-color); padding-top:1.5rem;">
              <h4 style="color:var(--brand-deep-blue); margin-bottom:1rem; font-size:1.1rem;">Fasilitas & Keunggulan Program:</h4>
              ${event.features.map(f => `<div class="feature-list-item"><span>✅</span> <span>${f}</span></div>`).join("")}
            </div>
          `;
        }

        detailContainer.innerHTML = `
          <!-- KOLOM KIRI: MAIN DETAILS -->
          <div class="event-detail-card">
            <div class="event-poster-wrapper">
              <img src="${bannerImg}" alt="${event.title}" onerror="this.src='../assets/images/hero-banner.png'">
            </div>

            <span class="event-subbrand-badge" style="font-size:0.8rem;">${subbrandLabel} • ${event.type || "Program"}</span>
            <h1 style="font-size:2rem; color:var(--brand-deep-blue); font-weight:800; margin-bottom:1rem; line-height:1.3;">
              ${event.title}
            </h1>

            ${contentHTML}
            ${featuresHTML}
          </div>

          <!-- KOLOM KANAN: SIDEBAR CHECKOUT & SUMMARY -->
          <div class="event-sidebar-card">
            <span style="font-size:0.75rem; color:var(--text-muted); text-transform:uppercase; font-weight:700;">Biaya Pendaftaran</span>
            <div style="font-size:2rem; font-weight:900; color:var(--brand-deep-blue); margin-bottom:1.5rem;">
              ${event.price || "Gratis"}
            </div>

            <div style="border-top:1px solid var(--border-color); border-bottom:1px solid var(--border-color); padding:1rem 0; margin-bottom:1.5rem;">
              <div style="margin-bottom:0.8rem; font-size:0.88rem;">
                <span style="color:var(--text-muted);">📅 Pelaksanaan:</span><br>
                <strong style="color:var(--text-main);">${event.date_event || "Jadwal Menyesuaikan"}</strong>
              </div>
              <div style="margin-bottom:0.8rem; font-size:0.88rem;">
                <span style="color:var(--text-muted);">💻 Format Belajar:</span><br>
                <strong style="color:var(--text-main);">${event.format || "KETAL / PLATO"}</strong>
              </div>
              <div style="font-size:0.88rem;">
                <span style="color:var(--text-muted);">⏳ Batas Pendaftaran:</span><br>
                <strong style="color:#EF4444;">${event.registration_deadline || "Selama Kuota Masih Ada"}</strong>
              </div>
            </div>

            <!-- TOMBOL CHECKOUT INTEGRASI MAYAR / SCALEV -->
            <a href="${checkoutLink}" target="_blank" rel="noopener" class="checkout-btn">
              Daftar Sekarang 🚀
            </a>
            
            <p style="font-size:0.75rem; color:var(--text-muted); text-align:center; margin-top:0.8rem;">
              🔒 Transaksi aman via Mayar / Scalev Payment Gateway.
            </p>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
