<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Showroom Events</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HERO SECTION -->
  <header class="hero-section">
    <div class="hero-container">
      <img src="banner-hero.png" alt="Banner Penawaran Program Aktif" class="hero-banner">
    </div>
  </header>

  <!-- MAIN CATALOG CONTAINER -->
  <main class="catalog-container">

    <!-- BARIS PENCARIAN -->
    <section class="search-section">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Cari nama kegiatan, kode, atau tag..." autocomplete="off">
        <button type="button" id="clearSearchBtn" class="clear-btn" hidden>&times;</button>
      </div>
    </section>

    <!-- PANEL FILTER MULTI-KATEGORI (ALA MARKETPLACE) -->
    <section class="filter-panel">
      <div class="filter-header">
        <h2>Filter Kegiatan</h2>
        <button type="button" id="resetFilterBtn" class="reset-btn">Reset Filter</button>
      </div>

      <!-- Scrollable Filter Rows -->
      <div class="filter-group-container">

        <!-- Status -->
        <div class="filter-group">
          <label class="filter-label">Status:</label>
          <div class="chips-wrapper" id="filterStatus">
            <button class="chip active" data-value="ALL">Semua</button>
            <button class="chip" data-value="Open">Open</button>
            <button class="chip" data-value="Close">Close</button>
          </div>
        </div>

        <!-- Bulan Kegiatan -->
        <div class="filter-group">
          <label class="filter-label">Bulan:</label>
          <div class="chips-wrapper" id="filterBulan">
            <button class="chip active" data-value="ALL">Semua</button>
            <button class="chip" data-value="Januari">Januari</button>
            <button class="chip" data-value="Februari">Februari</button>
            <button class="chip" data-value="Maret">Maret</button>
            <button class="chip" data-value="April">April</button>
            <button class="chip" data-value="Mei">Mei</button>
            <button class="chip" data-value="Juni">Juni</button>
            <button class="chip" data-value="Juli">Juli</button>
            <button class="chip" data-value="Agustus">Agustus</button>
            <button class="chip" data-value="September">September</button>
            <button class="chip" data-value="Oktober">Oktober</button>
            <button class="chip" data-value="November">November</button>
            <button class="chip" data-value="Desember">Desember</button>
          </div>
        </div>

        <!-- Afiliasi -->
        <div class="filter-group">
          <label class="filter-label">Afiliasi:</label>
          <div class="chips-wrapper" id="filterAfiliasi">
            <button class="chip active" data-value="ALL">Semua</button>
            <button class="chip" data-value="Kelas Bisa Juara">Kelas Bisa Juara</button>
            <button class="chip" data-value="Kelas Bisa Skill">Kelas Bisa Skill</button>
            <button class="chip" data-value="Kelas Bisa Lulus">Kelas Bisa Lulus</button>
          </div>
        </div>

        <!-- Sub-Brand -->
        <div class="filter-group">
          <label class="filter-label">Sub-Brand:</label>
          <div class="chips-wrapper" id="filterSubBrand">
            <button class="chip active" data-value="ALL">Semua</button>
            <button class="chip" data-value="Pilar Juara">Pilar Juara</button>
            <button class="chip" data-value="Gatra Adhika">Gatra Adhika</button>
            <button class="chip" data-value="Nestu">Nestu</button>
            <button class="chip" data-value="Lingua">Lingua</button>
            <button class="chip" data-value="Geodatis">Geodatis</button>
            <button class="chip" data-value="Arpa">Arpa</button>
            <button class="chip" data-value="Workit">Workit</button>
          </div>
        </div>

        <!-- Jenis Kegiatan -->
        <div class="filter-group">
          <label class="filter-label">Jenis:</label>
          <div class="chips-wrapper" id="filterJenis">
            <button class="chip active" data-value="ALL">Semua</button>
            <button class="chip" data-value="Try Out">Try Out</button>
            <button class="chip" data-value="Zoominar">Zoominar</button>
            <button class="chip" data-value="Pelatihan">Pelatihan</button>
            <button class="chip" data-value="Bimbel">Bimbel</button>
          </div>
        </div>

        <!-- Format Platform -->
        <div class="filter-group">
          <label class="filter-label">Platform:</label>
          <div class="chips-wrapper" id="filterPlatform">
            <button class="chip active" data-value="ALL">Semua</button>
            <button class="chip" data-value="Plato">Plato</button>
            <button class="chip" data-value="Platipus">Platipus</button>
            <button class="chip" data-value="Extra Plato">Extra Plato</button>
            <button class="chip" data-value="Extra Platipus">Extra Platipus</button>
          </div>
        </div>

        <!-- Format Waktu -->
        <div class="filter-group">
          <label class="filter-label">Format Waktu:</label>
          <div class="chips-wrapper" id="filterWaktu">
            <button class="chip active" data-value="ALL">Semua</button>
            <button class="chip" data-value="Zoominar">Zoominar</button>
            <button class="chip" data-value="Short Course">Short Course</button>
            <button class="chip" data-value="Long Course">Long Course</button>
            <button class="chip" data-value="Bootcamp">Bootcamp</button>
            <button class="chip" data-value="Bootcamp Premium">Bootcamp Premium</button>
          </div>
        </div>

      </div>
    </section>

    <!-- EVENT GRID CONTAINER -->
    <section class="events-section">
      <div id="eventsGrid" class="events-grid">
        <!-- Kartu event hasil fetch JSON akan di-render otomatis di sini lewat JavaScript -->
      </div>

      <!-- State Kosong / Tidak Ditemukan -->
      <div id="emptyState" class="empty-state" hidden>
        <p>Tidak ada kegiatan yang sesuai dengan filter atau pencarian Anda.</p>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
